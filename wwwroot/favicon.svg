<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradiente Fundo Portal John Marlon -->
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Gradiente Urna John Marlon Indigo/Blue -->
    <linearGradient id="urnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Gradiente Dourado/Amarelo Brasil -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gradiente Verde Eleitoral Confirmado -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Squircle Dark Estilo Portal John Marlon -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.5"/>

  <!-- Base da Urna Eletrônica / Caixa de Apuração -->
  <path d="M11 29 L53 29 L47 53 L17 53 Z" fill="url(#urnaGrad)" filter="url(#shadow)"/>
  
  <!-- Topo da Urna com Borda Chanfrada -->
  <rect x="9" y="25" width="46" height="5" rx="2" fill="#818cf8"/>
  
  <!-- Fenda de Inserção do Voto -->
  <rect x="22" y="26.5" width="20" height="2" rx="1" fill="#030712" opacity="0.9"/>

  <!-- Cédula / Voto Digital Entrando -->
  <g filter="url(#shadow)">
    <!-- Papel da Cédula -->
    <rect x="22" y="10" width="20" height="15" rx="2" fill="#ffffff"/>
    
    <!-- Faixas de Apuração Verde e Amarela (Brasil / TSE) -->
    <rect x="25" y="13.5" width="14" height="2.2" rx="1.1" fill="url(#goldGrad)"/>
    <rect x="25" y="17.5" width="9" height="2.2" rx="1.1" fill="url(#greenGrad)"/>

    <!-- Ponto de Apuração / Sinalizador -->
    <circle cx="36.5" cy="18.5" r="1.5" fill="#6366f1"/>
  </g>

  <!-- Círculo e Checkmark de Confirmação (VOTO CONFIRMADO) -->
  <g filter="url(#neonGlow)">
    <circle cx="46" cy="45" r="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <path d="M41.5 45 L44.5 48 L50.5 42" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
